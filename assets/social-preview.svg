<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Raft — Many nodes. One shared state.</title>
  <desc id="desc">The Raft TypeScript consensus toolkit. A graphite and ember Quorum mark accompanies the wordmark and Bun install command.</desc>
  <rect width="1280" height="640" fill="#F5F2EB"/>
  <g fill="#1B1C1E" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="194" font-size="154" font-weight="700" letter-spacing="-9">raft</text>
    <text x="72" y="334" font-size="70" font-weight="500" letter-spacing="-3">Many nodes.</text>
    <text x="72" y="412" font-size="70" font-weight="500" letter-spacing="-3">One shared state.</text>
    <text x="76" y="478" font-size="28" letter-spacing="-.7">A TypeScript consensus toolkit.</text>
    <text x="76" y="583" font-family="SFMono-Regular, Consolas, monospace" font-size="19">bun add @usex/raft</text>
    <text x="1208" y="583" text-anchor="end" font-size="12" letter-spacing="1.5">CORE / NESTJS / KV / OBSERVATORY</text>
  </g>
  <g transform="translate(702 -20) scale(1.23)" fill="none">
    <rect x="112" y="112" width="64" height="288" rx="32" fill="#1B1C1E"/>
    <path d="M240 144H296C334 144 364 166 364 196C364 226 334 248 296 248H240" stroke="#1B1C1E" stroke-width="64" stroke-linecap="round"/>
    <path d="M248 320L352 392" stroke="#ED805E" stroke-width="64" stroke-linecap="round"/>
  </g>
</svg>
